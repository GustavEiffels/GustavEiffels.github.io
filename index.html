    <script>
      // URL 해시에서 페이지 로드 (뒤로가기 / 직접 URL 접근 지원)
      async function _loadFragment(page) {
        const target = document.getElementById("content-target");
        target.style.opacity = 0;

        try {
          const response = await fetch(`content/${page}.html`);

          if (response.ok) {
            const html = await response.text();
            setTimeout(() => {
              target.innerHTML = html;

              // innerHTML은 <script>를 실행하지 않으므로 수동으로 재실행
              target.querySelectorAll("script").forEach((old) => {
                const s = document.createElement("script");
                s.textContent = old.textContent;
                document.body.appendChild(s);
                s.remove();
              });

              target.style.opacity = 1;
              updateActiveLink(page);
            }, 200);
          } else {
            throw new Error("Page not found");
          }
        } catch (err) {
          target.innerHTML =
            "<h1>Error</h1><div class='card'><p>콘텐츠를 불러오는 중 오류가 발생했습니다.</p></div>";
          target.style.opacity = 1;
        }
      }

      async function loadContent(page) {
        history.pushState({ page }, "", "#" + page);
        await _loadFragment(page);
      }

      function updateActiveLink(page) {
        document.querySelectorAll(".sidebar a").forEach((a) => {
          const dataPage = a.getAttribute("data-page");
          const isActive =
            dataPage && (page === dataPage || page.startsWith(dataPage + "/"));
          a.classList.toggle("active", !!isActive);
        });
      }

      // --- Global Content Helpers ---
      function toggleTOC() {
        const toc = document.getElementById("report-toc");
        const backdrop = document.getElementById("toc-backdrop");
        if (toc && backdrop) {
          toc.classList.toggle("active");
          backdrop.classList.toggle("active");
        }
      }

      function showAnswer(num) {
        const ans = document.getElementById("ans" + num);
        if (ans) {
          ans.style.display = ans.style.display === "block" ? "none" : "block";
        }
      }
      // ------------------------------

      window.onpopstate = function (event) {
        if (event.state && event.state.page) {
          _loadFragment(event.state.page);
        }
      };

      // 페이지 최초 진입 시 URL 해시로 콘텐츠 복원
      (function () {
        const hash = window.location.hash.slice(1);
        if (hash) {
          history.replaceState({ page: hash }, "", "#" + hash);
          _loadFragment(hash);
        }
      })();

      // Visitor counter from stats.json
      (function () {
        const isOwner = localStorage.getItem("site_owner") === "true";
        const counter = document.getElementById("visitor-counter");
        const eyeIcon = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

        if (isOwner) {
          counter.innerHTML = `
            <div class="visitor-card">
              <div class="visitor-card-header">${eyeIcon} ANALYTICS</div>
              <div class="visitor-card-row">
                <span class="visitor-card-label">owner mode</span>
              </div>
            </div>`;
          return;
        }

        fetch("/stats.json?t=" + Date.now())
          .then((r) => r.json())
          .then((d) => {
            counter.innerHTML = `
              <div class="visitor-card">
                <div class="visitor-card-header">${eyeIcon} ANALYTICS</div>
                <div class="visitor-card-row">
                  <span class="visitor-card-label">visitors</span>
                  <span class="visitor-card-value">${d.visitors.toLocaleString()}</span>
                </div>
                <div class="visitor-card-row">
                  <span class="visitor-card-label">pageviews</span>
                  <span class="visitor-card-value">${d.pageviews.toLocaleString()}</span>
                </div>
              </div>`;
          })
          .catch(() => {});
      })();
    </script>
