<style>
  .dev-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .pag-btn {
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pag-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--surface);
  }
  .pag-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .pag-btn.pag-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .pag-ellipsis {
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 4px;
    line-height: 36px;
  }
  #dev-post-list li {
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  #dev-post-list li:last-child {
    border-bottom: none;
  }
  #dev-post-list a:hover {
    text-decoration: underline;
  }
  .dev-post-meta {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-right: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .dev-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .dev-tab-btn {
    padding: 10px 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .dev-tab-btn:hover {
    color: var(--text);
  }
  .dev-tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
</style>

<h1>Development Log</h1>
<div class="card">
  <h2>Technology Stack and Research Topics</h2>
  <p>Technical records of building efficient systems.</p>

  <div class="dev-tabs" id="dev-tabs">
    <button class="dev-tab-btn active" data-category="record" onclick="devSetCategory('record')">Record</button>
    <button class="dev-tab-btn" data-category="algorithm" onclick="devSetCategory('algorithm')">Algorithm</button>
    <button class="dev-tab-btn" data-category="iwr" onclick="devSetCategory('iwr')">IndexingWaterRide</button>
    <button class="dev-tab-btn" data-category="stockapp" onclick="devSetCategory('stockapp')">Stock Favorite List</button>
  </div>

  <ul id="dev-post-list" style="list-style:none; padding:0; margin: 20px 0 0;">
    <li style="color: var(--text-muted); font-size: 14px;">로딩 중...</li>
  </ul>

  <div id="dev-pagination" class="dev-pagination"></div>
</div>

<script>
(function () {
  const PER_PAGE = 10;
  let allPosts = [];
  let currentPage = 1;
  let currentCategory = 'record';

  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getFilteredPosts() {
    return allPosts.filter((post) => (post.category || 'record') === currentCategory);
  }

  window.devSetCategory = function (category) {
    if (category === currentCategory) return;
    currentCategory = category;
    document.querySelectorAll('#dev-tabs .dev-tab-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.category === category);
    });
    renderList(1);
  };

  function renderList(page) {
    currentPage = page;
    const list = document.getElementById('dev-post-list');
    if (!list) return;

    const filtered = getFilteredPosts();
    const start = (page - 1) * PER_PAGE;
    const slice = filtered.slice(start, start + PER_PAGE);

    if (slice.length === 0) {
      list.innerHTML = '<li style="color: var(--text-muted); font-size: 14px;">게시글이 없습니다.</li>';
      renderPagination();
      return;
    }

    list.innerHTML = slice.map(post => `
      <li>
        <a onclick="loadContent('${escHtml(post.file)}')" style="color: var(--accent); cursor: pointer; font-size: 14px; line-height: 1.8; text-decoration: none;">
          <span class="dev-post-meta">[${escHtml(post.date)}]</span>${escHtml(post.title)}
        </a>
      </li>
    `).join('');

    renderPagination();
  }

  function renderPagination() {
    const pag = document.getElementById('dev-pagination');
    if (!pag) return;

    const total = Math.ceil(getFilteredPosts().length / PER_PAGE);
    if (total <= 1) { pag.innerHTML = ''; return; }

    const WINDOW = 2;
    let pages = new Set();
    pages.add(1);
    pages.add(total);
    for (let i = Math.max(1, currentPage - WINDOW); i <= Math.min(total, currentPage + WINDOW); i++) {
      pages.add(i);
    }
    const sorted = [...pages].sort((a, b) => a - b);

    let html = `<button class="pag-btn" onclick="devGoPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

    let prev = null;
    for (const p of sorted) {
      if (prev !== null && p - prev > 1) {
        html += `<span class="pag-ellipsis">···</span>`;
      }
      html += `<button class="pag-btn ${p === currentPage ? 'pag-active' : ''}" onclick="devGoPage(${p})">${p}</button>`;
      prev = p;
    }

    html += `<button class="pag-btn" onclick="devGoPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''}>›</button>`;
    pag.innerHTML = html;
  }

  window.devGoPage = function (page) {
    const total = Math.ceil(getFilteredPosts().length / PER_PAGE);
    if (page < 1 || page > total) return;
    renderList(page);
    document.getElementById('dev-post-list')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  fetch('data/dev-posts.json')
    .then(r => r.json())
    .then(posts => {
      allPosts = posts.sort((a, b) => b.date.localeCompare(a.date));
      renderList(1);
    })
    .catch(() => {
      const list = document.getElementById('dev-post-list');
      if (list) list.innerHTML = '<li style="color:var(--red)">데이터를 불러오지 못했습니다.</li>';
    });
})();
</script>
